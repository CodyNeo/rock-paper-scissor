<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script defer src="my-script.js"></script>
    <title>Rock Paper Scissor</title>
</head>
<body>
    <div class="images">
        <img class="image" src="./images/rock.jpeg" alt="rock">
        <img class="image" src='./images/paper.jpeg' alt="paper">
        <img class="image" src="./images/scissors.jpeg" alt="scissors">
    </div> 
    <div class="game-container">
        <div class="player">
            <p>Player</p>
            <img class="choice" src="./images/white.jpeg">
        </div>
        <p class="VS">VS</p>
        <div class="computer">
            <p>Computer</p>
            <img class="choice" src="./images/white.jpeg">
        </div>
    </div>
    <p class="text">Player's Score:0</p>
    <p class="text">Compuetr's Score:0</p>
</body>
</html>
